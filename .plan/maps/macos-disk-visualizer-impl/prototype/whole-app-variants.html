<!--
  ┌──────────────────────────────────────────────────────────────────────────┐
  │  PROTOTYPE — THROWAWAY.  macOS Disk Visualizer · gold-standard reference    │
  │  Impl-map Ticket 01.                                                       │
  │                                                                            │
  │  An HTML mock of a NATIVE AppKit app (NSSplitViewController + NSOutlineView │
  │  tree + custom Core Graphics treemap NSView). It exists to be reacted to.   │
  │  Double-click to run — no server, no build.                                 │
  │                                                                            │
  │  SETTLED — three deferred-within-v1 presentation details, each chosen by a  │
  │  human from live side-by-side variants; the losers are culled from here:    │
  │    · Tree     — Name │ Size │ % │ Items, sortable headers, default Size ▼.  │
  │                 The % cell carries the number AND an inline proportional    │
  │                 bar; no separate bar column, no Kind column.                │
  │    · Package  — expanding a package in the tree subdivides its treemap box, │
  │                 exactly like a folder. The outer rect never changes area.   │
  │    · Legend   — a second status-bar row carrying all 12 kind swatches plus  │
  │                 "Merged", always visible, never behind an interaction.      │
  │  Still switchable: the six lifecycle states, and light/dark.                │
  │                                                                            │
  │  STILL OPEN — the merge rule (see merge-rule-variants.html). Fixed here to  │
  │  fixpoint + merge-box-last; swap MERGE_STRATEGY / MERGE_SORT below.         │
  │                                                                            │
  │  Everything traces to spec.md: §3 measurement, §6 treemap, §7 workspace.    │
  └──────────────────────────────────────────────────────────────────────────┘

<title>Disk Visualizer — Whole App Variants</title>
<style>
  :root{
    --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Monaco,monospace;

    --win-bg:#ECECEC; --content-bg:#FFFFFF; --sidebar-bg:#F3F3F4; --panel-bg:#FAFAFB;
    --head-bg:#F0F0F2;
    --sep:rgba(0,0,0,.10); --sep-strong:rgba(0,0,0,.16);
    --text:#1D1D1F; --text-2:#6E6E73; --text-3:#9A9AA0;
    --accent:#007AFF; --sel-bg:#0A6CFF; --sel-bg-blur:#D6D6D9; --sel-text:#FFFFFF;
    --danger:#D0342C; --warning:#B4740A; --cloud:#8E8E93;
    --ctl-bg:#FFFFFF; --ctl-bg-2:#F2F2F5; --ctl-border:rgba(0,0,0,.16);
    --shadow:0 12px 40px rgba(0,0,0,.22),0 1px 3px rgba(0,0,0,.12);
    --tm-void:#E4E4E8;
    --hair:.5px;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --win-bg:#2B2B2D; --content-bg:#1E1E20; --sidebar-bg:#242426; --panel-bg:#1B1B1D;
    --head-bg:#252528;
    --sep:rgba(255,255,255,.12); --sep-strong:rgba(255,255,255,.18);
    --text:#F5F5F7; --text-2:#A1A1A6; --text-3:#6E6E73;
    --accent:#0A84FF; --sel-bg:#0A6CFF; --sel-bg-blur:#3A3A3D; --sel-text:#FFFFFF;
    --danger:#FF6961; --warning:#FFB340; --cloud:#98989D;
    --ctl-bg:#3A3A3C; --ctl-bg-2:#2C2C2E; --ctl-border:rgba(255,255,255,.14);
    --shadow:0 12px 40px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);
    --tm-void:#0E0E10;
  }}
  :root[data-theme="dark"]{
    --win-bg:#2B2B2D; --content-bg:#1E1E20; --sidebar-bg:#242426; --panel-bg:#1B1B1D;
    --head-bg:#252528;
    --sep:rgba(255,255,255,.12); --sep-strong:rgba(255,255,255,.18);
    --text:#F5F5F7; --text-2:#A1A1A6; --text-3:#6E6E73;
    --accent:#0A84FF; --sel-bg:#0A6CFF; --sel-bg-blur:#3A3A3D; --sel-text:#FFFFFF;
    --danger:#FF6961; --warning:#FFB340; --cloud:#98989D;
    --ctl-bg:#3A3A3C; --ctl-bg-2:#2C2C2E; --ctl-border:rgba(255,255,255,.14);
    --shadow:0 12px 40px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);
    --tm-void:#0E0E10;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--sf); font-size:13px; color:var(--text);
    background:var(--content-bg); -webkit-font-smoothing:antialiased;
    overflow:hidden; user-select:none;
  }
  .win{ position:fixed; inset:0 0 0 0; display:flex; flex-direction:column }

  /* ---------- unified toolbar ---------- */
  .toolbar{
    flex:0 0 auto; height:52px; display:flex; align-items:center; gap:9px; padding:0 12px;
    background:var(--win-bg); border-bottom:var(--hair) solid var(--sep-strong); z-index:5;
  }
  .lights{ display:flex; gap:8px; margin-right:5px }
  .lights i{ width:12px; height:12px; border-radius:50%; display:block; box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18) }
  .lights .r{background:#FF5F57} .lights .y{background:#FEBC2E} .lights .g{background:#28C840}
  .tb-title{ font-weight:600; white-space:nowrap }
  .tb-title small{ color:var(--text-3); font-weight:500 }
  .spring{ flex:1 1 auto }
  .vsep{ width:1px; height:22px; background:var(--sep-strong); margin:0 3px }

  .btn{
    font:13px var(--sf); color:var(--text); background:var(--ctl-bg);
    border:var(--hair) solid var(--ctl-border); border-radius:6px; padding:5px 11px;
    display:inline-flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .btn:hover{ filter:brightness(.98) } .btn:active{ filter:brightness(.93) }
  .btn[disabled]{ opacity:.38; cursor:default; filter:none }
  .btn.primary{ background:var(--accent); border-color:transparent; color:#fff }
  .btn.on{ background:var(--ctl-bg-2); box-shadow:inset 0 1px 2px rgba(0,0,0,.10); color:var(--text-2) }
  .btn.danger{ color:var(--danger) }
  .btn svg{ width:14px; height:14px } .btn.icon{ padding:5px 8px }

  /* ---------- stage / split ---------- */
  .stage{ flex:1 1 auto; position:relative; min-height:0; display:flex; flex-direction:column }
  .split{ flex:1 1 auto; display:flex; min-height:0 }
  .divider{ flex:0 0 auto; width:var(--hair); background:var(--sep-strong); cursor:col-resize; position:relative }
  .divider::after{ content:""; position:absolute; inset:-2px -4px }
  .pane{ min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden }

  /* ---------- tree ---------- */
  .thead{
    flex:0 0 auto; display:flex; height:23px; align-items:stretch;
    background:var(--head-bg); border-bottom:var(--hair) solid var(--sep-strong);
    font-size:11px; color:var(--text-2); font-weight:500;
  }
  .thead .th{
    display:flex; align-items:center; padding:0 8px; cursor:pointer; gap:3px;
    border-right:var(--hair) solid var(--sep); white-space:nowrap; overflow:hidden;
  }
  .thead .th:last-child{ border-right:none }
  .thead .th:hover{ background:color-mix(in srgb,var(--text) 6%,transparent) }
  .thead .th.on{ color:var(--text); font-weight:650 }
  .thead .th .car{ font-size:8px; opacity:.85 }
  .thead .th.num{ justify-content:flex-end }

  .tree{ flex:1 1 auto; overflow:auto; background:var(--sidebar-bg); outline:none }
  .tree.plain{ background:var(--content-bg) }
  .trow{ display:flex; align-items:center; height:22px; cursor:default; position:relative; font-size:12.5px }
  .trow:hover{ background:color-mix(in srgb,var(--text) 5%,transparent) }
  .trow.sel{ background:var(--sel-bg) }
  .trow.sel, .trow.sel *{ color:var(--sel-text)!important }
  .tree:not(.focused) .trow.sel{ background:var(--sel-bg-blur) }
  .tree:not(.focused) .trow.sel, .tree:not(.focused) .trow.sel *{ color:var(--text)!important }

  .tc{ padding:0 8px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; flex:0 0 auto }
  .tc.name{ flex:1 1 auto; display:flex; align-items:center; gap:5px; padding-left:0 }
  .tc.num{ text-align:right; font-variant-numeric:tabular-nums; color:var(--text-2) }
  .disc{ width:13px; flex:0 0 13px; display:grid; place-items:center; color:var(--text-3); cursor:pointer }
  .disc svg{ width:8px; height:8px; transition:transform .11s ease }
  .trow.open .disc svg{ transform:rotate(90deg) }
  .swatch{ width:9px; height:9px; border-radius:2px; flex:0 0 9px }
  .swatch.hatch{ background-image:repeating-linear-gradient(45deg,#9A9AA0 0 2px,#C8C8CE 2px 4px) }
  .nm{ overflow:hidden; text-overflow:ellipsis }
  .tag{ font-size:9.5px; padding:0 4px; border-radius:3px; flex:0 0 auto; line-height:14px }
  .tag.err{ color:var(--danger); background:color-mix(in srgb,var(--danger) 15%,transparent) }
  .tag.warn{ color:var(--warning); background:color-mix(in srgb,var(--warning) 20%,transparent) }
  .tag.link{ color:var(--cloud); background:color-mix(in srgb,var(--cloud) 18%,transparent) }
  .tag.pkg{ color:var(--accent); background:color-mix(in srgb,var(--accent) 15%,transparent) }

  /* percent bar treatments */
  .pbar{ height:5px; border-radius:3px; background:color-mix(in srgb,var(--text) 12%,transparent); overflow:hidden; flex:0 0 auto }
  .pbar > i{ display:block; height:100%; background:var(--text-3); opacity:.7 }
  .trow.sel .pbar{ background:rgba(255,255,255,.28) } .trow.sel .pbar>i{ background:rgba(255,255,255,.9) }
  .pctcell{ display:flex; align-items:center; gap:6px; justify-content:flex-end }
  .pctcell .pbar{ width:44px }

  /* ---------- treemap ---------- */
  .tmwrap{ flex:1 1 auto; position:relative; background:var(--tm-void); overflow:hidden }
  .tmwrap canvas{ display:block; position:absolute; inset:0 }
  .tm-note{
    position:absolute; left:10px; bottom:10px; z-index:3; max-width:calc(100% - 20px);
    background:color-mix(in srgb,var(--panel-bg) 92%,transparent); color:var(--text-2);
    border:var(--hair) solid var(--sep-strong); border-radius:8px; padding:6px 10px; font-size:11.5px;
    box-shadow:0 2px 10px rgba(0,0,0,.14); backdrop-filter:blur(8px);
  }
  .tm-note b{ color:var(--text) }

  /* ---------- inspector ---------- */
  .inspector{ background:var(--panel-bg); flex:1 1 auto; overflow:auto }
  .ins-pad{ padding:13px 15px 18px }
  .ins-empty{ height:100%; display:grid; place-items:center; color:var(--text-3); text-align:center; padding:26px; font-size:12.5px; line-height:1.5 }
  .ins-title{ display:flex; align-items:center; gap:8px }
  .ins-title .swatch{ width:12px; height:12px; border-radius:3px; flex:0 0 12px }
  .ins-title h3{ font-size:15px; font-weight:650; margin:0; overflow-wrap:anywhere; line-height:1.25 }
  .ins-kind{ color:var(--text-2); font-size:11.5px; margin:3px 0 11px }
  .ins-size{ font-size:25px; font-weight:650; letter-spacing:-.015em; font-variant-numeric:tabular-nums; line-height:1.1 }
  .ins-size small{ font-size:12px; font-weight:500; color:var(--text-2); margin-left:6px; letter-spacing:0 }
  .ins-bytes{ color:var(--text-3); font-size:10.5px; font-family:var(--mono); margin-top:3px }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:5px 12px; margin-top:13px; font-size:12px }
  .kv dt{ color:var(--text-2); white-space:nowrap }
  .kv dd{ margin:0; text-align:right; overflow-wrap:anywhere; font-variant-numeric:tabular-nums }
  .path{
    font-family:var(--mono); font-size:10.5px; color:var(--text-2); background:var(--ctl-bg-2);
    border:var(--hair) solid var(--sep); border-radius:6px; padding:7px 9px; margin-top:13px;
    overflow-wrap:anywhere; user-select:text; line-height:1.4;
  }
  .note{ margin-top:11px; padding:8px 10px; border-radius:8px; font-size:11.5px; line-height:1.45; display:flex; gap:7px }
  .note .gl{ flex:0 0 auto; font-size:12px }
  .note.err{ background:color-mix(in srgb,var(--danger) 13%,transparent); color:var(--danger) }
  .note.warn{ background:color-mix(in srgb,var(--warning) 16%,transparent); color:var(--warning) }
  .note.info{ background:color-mix(in srgb,var(--cloud) 14%,transparent); color:var(--text-2) }
  .note b{ font-weight:650 }
  .note .p{ font-family:var(--mono); font-size:10px; word-break:break-all; display:block; margin-top:2px }
  .ins-actions{ display:flex; gap:7px; margin-top:15px }
  .ins-actions .btn{ flex:1 1 auto; justify-content:center }
  .ins-foot{ margin-top:12px; font-size:10.5px; color:var(--text-3); line-height:1.5 }
  .ins-foot code{ font-family:var(--mono) }

  /* ---------- legend ---------- */
  .lg{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-2); white-space:nowrap }
  .lg i{ width:9px; height:9px; border-radius:2px; flex:0 0 9px }
  .lg i.hatch{ background-image:repeating-linear-gradient(45deg,#9A9AA0 0 2px,#C8C8CE 2px 4px) }

  /* ---------- status bar ---------- */
  .statusbar{
    flex:0 0 auto; background:var(--win-bg); border-top:var(--hair) solid var(--sep-strong);
    font-size:11px; color:var(--text-2); font-variant-numeric:tabular-nums;
  }
  .sbrow{ height:26px; display:flex; align-items:center; gap:13px; padding:0 13px }
  .sbrow + .sbrow{ border-top:var(--hair) solid var(--sep); height:24px }
  .sbrow .s{ display:flex; align-items:center; gap:5px; white-space:nowrap }
  .sbrow .s b{ color:var(--text); font-weight:650 }
  .sbrow .s.err{ color:var(--danger) } .sbrow .s.exc{ color:var(--cloud) }
  .legendrow{ display:flex; gap:11px; overflow:hidden; flex-wrap:nowrap }

  /* ---------- banner ---------- */
  .banner{
    flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:7px 13px; font-size:12px;
    border-bottom:var(--hair) solid var(--sep);
  }
  .banner.warn{ background:color-mix(in srgb,var(--warning) 17%,var(--win-bg)); color:var(--warning) }
  .banner.err{ background:color-mix(in srgb,var(--danger) 13%,var(--win-bg)); color:var(--danger) }
  .banner .dot{ width:8px; height:8px; border-radius:50%; background:currentColor; flex:0 0 8px }
  .banner b{ color:var(--text); font-weight:650 }
  .banner .lnk{ color:var(--accent); cursor:pointer; font-weight:500; margin-left:auto; white-space:nowrap }

  /* ---------- empty / scanning ---------- */
  .empty{ position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:30px }
  .empty .in{ max-width:430px; display:flex; flex-direction:column; align-items:center; gap:5px }
  .empty h1{ font-size:21px; font-weight:650; margin:8px 0 0 }
  .empty p{ color:var(--text-2); margin:2px 0 13px; line-height:1.5 }
  .empty .fine{ margin-top:15px; font-size:11.5px; color:var(--text-3); line-height:1.75 }

  .scancard{
    position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); width:min(560px,84%);
    background:var(--panel-bg); border:var(--hair) solid var(--sep-strong); border-radius:14px;
    box-shadow:var(--shadow); padding:20px 22px; z-index:6;
  }
  .scancard h2{ margin:0 0 3px; font-size:15.5px; font-weight:650 }
  .scancard .cur{ font-family:var(--mono); font-size:10.5px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:rtl; text-align:left }
  .track{ height:6px; border-radius:4px; background:color-mix(in srgb,var(--text) 12%,transparent); overflow:hidden; margin:13px 0 4px; position:relative }
  .track > i{ position:absolute; top:0; bottom:0; width:32%; border-radius:4px; background:var(--accent); animation:indet 1.25s ease-in-out infinite }
  .track.det > i{ left:0; animation:none; transition:width .2s linear }
  @keyframes indet{ 0%{left:-32%} 100%{left:100%} }
  .approx{ font-size:11px; color:var(--text-3); margin-top:2px }
  .telem{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; margin-top:13px }
  .telem .t{ background:var(--ctl-bg-2); border-radius:8px; padding:7px 9px }
  .telem .lab{ font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3) }
  .telem .val{ font-size:14.5px; font-weight:650; font-variant-numeric:tabular-nums; margin-top:2px }
  .scan-act{ display:flex; justify-content:flex-end; margin-top:14px }

  /* ---------- chooser sheet ---------- */
  .scrim{ position:absolute; inset:0; background:rgba(0,0,0,.16); z-index:20; display:grid; place-items:start center }
  .sheet{ width:min(560px,92%); background:var(--win-bg); border-radius:0 0 12px 12px; box-shadow:var(--shadow); overflow:hidden; animation:drop .2s cubic-bezier(.2,.9,.3,1) }
  @keyframes drop{ from{transform:translateY(-14px);opacity:.4} to{transform:none;opacity:1} }
  .sheet header{ padding:15px 19px 3px } .sheet header h2{ margin:0; font-size:14.5px; font-weight:650 }
  .sheet header p{ margin:3px 0 0; font-size:11.5px; color:var(--text-2) }
  .sheet .list{ padding:8px 11px 4px; max-height:330px; overflow:auto }
  .vrow{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:default }
  .vrow:hover:not(.dis){ background:color-mix(in srgb,var(--accent) 13%,transparent) }
  .vrow.sel{ background:var(--sel-bg) } .vrow.sel *{ color:#fff!important }
  .vrow.dis{ opacity:.5 }
  .vrow .ic{ width:26px; flex:0 0 26px; display:grid; place-items:center; color:var(--accent) }
  .vrow.dis .ic{ color:var(--text-3) }
  .vrow .ic svg{ width:22px; height:22px }
  .vrow .meta{ flex:1 1 auto; min-width:0 }
  .vrow .n{ font-weight:650; font-size:12.5px } .vrow .d{ font-size:11px; color:var(--text-2) }
  .vrow .cap{ font-size:11px; color:var(--text-3); text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums }
  .vrow .why{ font-size:10.5px; color:var(--danger); text-align:right; max-width:170px; line-height:1.3 }
  .sheet footer{ display:flex; align-items:center; gap:8px; padding:11px 19px; border-top:var(--hair) solid var(--sep) }
  .sheet footer .fine{ font-size:11px; color:var(--text-2); display:flex; align-items:center; gap:6px }
  .sheet footer .fine code{ font-family:var(--mono); font-size:10px }

  /* ---------- error summary sheet ---------- */
  .errsheet{ width:min(520px,92%); background:var(--panel-bg); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; margin-top:60px }
  .errsheet header{ padding:14px 18px 8px; border-bottom:var(--hair) solid var(--sep) }
  .errsheet h2{ margin:0; font-size:14.5px; font-weight:650 }
  .errsheet .body{ padding:10px 18px; max-height:300px; overflow:auto; font-size:12px }
  .erow{ display:flex; gap:9px; padding:6px 0; border-bottom:var(--hair) solid var(--sep); line-height:1.45 }
  .erow:last-child{ border-bottom:none }
  .erow .gl{ flex:0 0 auto } .erow .p{ font-family:var(--mono); font-size:10.5px; color:var(--text-2); word-break:break-all }
  .errsheet footer{ display:flex; justify-content:flex-end; padding:11px 18px; border-top:var(--hair) solid var(--sep) }

  /* ---------- tooltip ---------- */
  .tip{
    position:fixed; z-index:70; pointer-events:none; opacity:0; transition:opacity .08s;
    background:rgba(28,28,30,.97); color:#fff; border:1px solid rgba(255,255,255,.14);
    border-radius:8px; padding:7px 10px; font-size:11.5px; line-height:1.5;
    box-shadow:0 8px 26px rgba(0,0,0,.42); max-width:340px;
  }
  .tip.on{ opacity:1 }
  .tip b{ font-weight:650 } .tip .p{ font-family:var(--mono); font-size:10px; color:#9CC9FF; word-break:break-all }
  .tip .flag{ color:#FFD166 }

  /* ---------- toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:76px; transform:translateX(-50%) translateY(8px);
    background:rgba(24,24,27,.96); color:#fff; padding:9px 15px; border-radius:10px; font-size:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.42); opacity:0; transition:opacity .16s,transform .16s;
    z-index:80; pointer-events:none; border:1px solid rgba(255,255,255,.12); max-width:min(560px,92vw); text-align:center;
  }
  .toast.on{ opacity:1; transform:translateX(-50%) translateY(0) }
  .toast code{ font-family:var(--mono); color:#8FD0FF }

  /* ---------- PROTO bar (deliberately not macOS) ---------- */
  .protobar{
    position:fixed; left:50%; bottom:12px; transform:translateX(-50%);
    display:flex; align-items:center; gap:6px; z-index:90; flex-wrap:wrap; justify-content:center;
    max-width:calc(100vw - 16px);
    background:rgba(24,24,27,.94); color:#fff; border:1px solid rgba(255,255,255,.15);
    border-radius:13px; padding:6px 8px; box-shadow:0 12px 34px rgba(0,0,0,.45);
    backdrop-filter:blur(20px); font-size:11.5px;
  }
  .protobar .plabel{ font:700 9px var(--sf); letter-spacing:.14em; text-transform:uppercase; color:#FF9F3B; padding:0 3px }
  .protobar .grp{ display:flex; align-items:center; gap:5px }
  .protobar .gl{ font-size:9px; letter-spacing:.09em; text-transform:uppercase; color:rgba(255,255,255,.5) }
  .protobar .seg{ display:flex; background:rgba(255,255,255,.09); border-radius:8px; padding:2px; gap:2px }
  .protobar .seg button{ background:transparent; border:none; color:rgba(255,255,255,.74); font:inherit; padding:3px 7px; border-radius:6px; cursor:pointer; white-space:nowrap }
  .protobar .seg button:hover{ color:#fff; background:rgba(255,255,255,.1) }
  .protobar .seg button.on{ background:rgba(255,255,255,.92); color:#111; font-weight:650 }

<script>
/* =====================================================================

const KIB = 1024, MIB = 1024 * KIB, GIB = 1024 * MIB;
const MIN_PT = 2;

/* ---------- §3.2 formatting: IEC, 3 sig figs, no ByteCountFormatter ---------- */
const UNITS = ["bytes", "KiB", "MiB", "GiB", "TiB"];
function fmtIEC(b) {
  b = Math.round(b);
  if (b === 0) return "0 bytes";
  if (b === 1) return "1 byte";
  if (b < 1024) return b + " bytes";
  let u = 0, v = b;
  while (v >= 1024 && u < UNITS.length - 1) { v /= 1024; u++; }
  return v.toFixed(v >= 100 ? 0 : v >= 10 ? 1 : 2) + " " + UNITS[u];
}
const grp = n => Math.round(n).toLocaleString("en-US");
function pct(x) {                                  // 1 decimal, "< 0.1%" floor, never "0.0%"
  if (x <= 0) return "0%";
  if (x < 0.05) return "< 0.1%";
  return x.toFixed(1) + "%";
}

/* ---------- §6.3 kind → hue: 11 groups + gray "other" ---------- */
const KIND_GROUPS = [
  ["code",      210, ["swift","m","c","cpp","h","js","ts","tsx","py","rb","go","rs","java","kt","sh","json","yml","yaml","xml","html","css","md","lock"]],
  ["image",     150, ["png","jpg","jpeg","gif","heic","tiff","bmp","webp","svg","raw","icns","photoslibrary"]],
  ["video",     280, ["mp4","mov","mkv","avi","m4v","webm"]],
  ["audio",      20, ["mp3","aac","m4a","wav","flac","ogg","aiff"]],
  ["document",   45, ["pdf","doc","docx","rtf","txt","pages","epub","numbers","key","xls","xlsx","ppt","pptx","csv"]],
  ["archive",     0, ["zip","tar","gz","tgz","bz2","xz","rar","7z","zst"]],
  ["app",       340, ["app","pkg","ipa"]],
  ["diskimage", 260, ["dmg","iso","img","sparseimage","sparsebundle"]],
  ["font",      180, ["ttf","otf","woff","woff2","ttc"]],
  ["data",       90, ["sqlite","db","dat","bin","log","idx","pack"]],
  ["system",    220, ["dylib","so","a","framework","kext","plist","cache"]],
];
const KIND_LABEL = {
  code:"Code", image:"Image", video:"Video", audio:"Audio", document:"Document",
  archive:"Archive", app:"Application", diskimage:"Disk image", font:"Font",
  data:"Data", system:"System", other:"Other", dir:"Folder",
};
const EXT2G = (() => { const m = new Map(); for (const [g,,e] of KIND_GROUPS) for (const x of e) m.set(x, g); return m; })();
function kindOf(name) {
  const i = name.lastIndexOf(".");
  return (i >= 0 ? EXT2G.get(name.slice(i + 1).toLowerCase()) : null) || "other";
}
function kindColor(g, dark) {
  const e = KIND_GROUPS.find(k => k[0] === g);
  return `hsl(${e ? e[1] : 0} ${e ? 55 : 0}% ${dark ? 60 : 52}%)`;
}
const isDark = () => {
  const t = document.documentElement.getAttribute("data-theme");
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
};

/* =====================================================================
   FIXTURE — one whole-volume scan carrying every §3.4 semantic
   ===================================================================== */
function rand(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function tinies(prefix, ext, n, lo, hi, seed) {
  const r = rand(seed), out = [];
  for (let i = 0; i < n; i++) out.push(F(`${prefix}-${i}.${ext}`, Math.round(lo * Math.pow(hi / lo, r()))));
  return out;
}
const F = (name, bytes, flags) => ({ name, bytes, ...(flags || {}) });
const D = (name, children, flags) => ({ name, children, ...(flags || {}) });

// Package children sum EXACTLY to the already-measured aggregate (§3.4 invariant).
function packageChildren(total, parts) {
  const out = [];
  let used = 0;
  parts.forEach(([name, frac], i) => {
    const b = i === parts.length - 1 ? total - used : Math.round(total * frac);
    used += b;
    out.push(name.endsWith("/") ? D(name.slice(0, -1), [F(name.slice(0, -1) + ".bin", b)]) : F(name, b));
  });

}

const RAW = D("Macintosh HD", [

      F("big-lecture.mov", 1.6 * GIB, { cloud: "downloaded" }),

/* ---------- build node graph ---------- */
let SEQ = 0;
const BYID = {};
function build(raw, parent) {
  const n = {
    id: ++SEQ, name: raw.name, parent,
    path: parent ? parent.path + "/" + raw.name : "/" + raw.name,
    pkg: !!raw.pkg, hidden: !!raw.hidden, unreadable: !!raw.unreadable,
    symlink: raw.symlink || null, hardlink: raw.hardlink || null, cloud: raw.cloud || null,
    volume: !!raw.volume, capacity: raw.capacity || 0, free: raw.free || 0,
    omitted: raw.omitted || 0, omittedName: raw.omittedName || null,
    children: null, own: 0, nominal: 0,
  };
  n.kind = raw.children ? "dir" : kindOf(raw.name);
  if (raw.pkg) {
    // §3.4: the aggregate is measured during the scan; children exist but stay
    // collapsed until the user expands/drills in. Built eagerly here so nothing
    // mutates the tree during a render pass.
    n.kind = kindOf(raw.name);
    n.own = 0;
    n.nominal = Math.round(raw.bytes);
    n.children = packageChildren(n.nominal, raw.pkgParts).map(c => build(c, n));
  } else if (raw.children) {
    n.children = raw.children.map(c => build(c, n));
  } else {
    n.nominal = Math.round(raw.bytes);
    n.own = (raw.symlink || raw.hardlink) ? 0 : n.nominal;   // §3.4 zero-attribution
  }
  BYID[n.id] = n;
  return n;
}
const ROOT = build(RAW, null);

function rollup(n) {
  if (!n.children) { n.sub = n.own; n.files = 0; n.dirs = 0; n.items = 1; return n; }
  let s = 0, f = 0, d = 0, it = 1;
  for (const c of n.children) { rollup(c); s += c.sub; it += c.items;
    if (c.children || c.pkg && c.children) { d += 1 + c.dirs; f += c.files; } else { f += 1; } }
  n.sub = s; n.files = f; n.dirs = d; n.items = it;
  return n;
}
rollup(ROOT);

let ORDER = 0;
function seqOrder() { ORDER = 0; (function w(n) { n.seq = ++ORDER; (n.children || []).forEach(w); })(ROOT); }
seqOrder();

const TOTAL = ROOT.sub;
const EXCLUSIONS = [
  { path: "/Users/rengwu/Downloads/keynote-remote-only.key", why: "iCloud — not downloaded" },
  { path: "/Users/rengwu/Pictures/Photos Library.photoslibrary/originals/IMG_4417.heic", why: "iCloud — not downloaded" },
  { path: "/Users/rengwu/Pictures/Photos Library.photoslibrary/originals/IMG_5230.heic", why: "iCloud — not downloaded" },
];
const ERRORS = [{ path: "/Library/Application Support/com.protected.vault", why: "Permission denied — size not guessed" }];

/* =====================================================================
   SQUARIFIED LAYOUT + MERGE (identical engine to merge-rule-variants.html)
   ===================================================================== */
function worstRatio(row, sum, short, scale) {
  if (!row.length) return Infinity;
  const thick = (sum * scale) / short;
  if (thick <= 0) return Infinity;
  let w = 0;
  for (const it of row) { const len = (it.value * scale) / thick; if (len <= 0) return Infinity;
    w = Math.max(w, Math.max(len / thick, thick / len)); }
  return w;
}
function squarify(items, rect) {
  const out = [], total = items.reduce((a, i) => a + i.value, 0);
  if (total <= 0 || rect.w <= 0 || rect.h <= 0) return out;
  const scale = (rect.w * rect.h) / total;
  let free = { ...rect }, i = 0;
  while (i < items.length && free.w > 1e-9 && free.h > 1e-9) {
    const short = Math.min(free.w, free.h), row = [];
    let sum = 0, best = Infinity;
    while (i < items.length) {
      const c = worstRatio(row.concat(items[i]), sum + items[i].value, short, scale);
      if (row.length && c > best) break;
      row.push(items[i]); sum += items[i].value; best = c; i++;
    }
    const thick = (sum * scale) / short;
    if (free.w >= free.h) {
      let y = free.y;
      for (const it of row) { const h = (it.value * scale) / thick; out.push({ item: it, x: free.x, y, w: thick, h }); y += h; }
      free = { x: free.x + thick, y: free.y, w: free.w - thick, h: free.h };
    } else {
      let x = free.x;
      for (const it of row) { const w = (it.value * scale) / thick; out.push({ item: it, x, y: free.y, w, h: thick }); x += w; }
      free = { x: free.x, y: free.y + thick, w: free.w, h: free.h - thick };
    }
  }
  return out;
}
function layoutChildren(kids, rect) {
  const nameOf = it => it.merge ? "￿￿" : it.node.name;
  const order = (a, b) => (b.value - a.value) || (nameOf(a) < nameOf(b) ? -1 : nameOf(a) > nameOf(b) ? 1 : 0);
  function pack(surv, merged) {
    let items = surv.slice(), mi = null;
    if (merged.length) {
      const bytes = merged.reduce((a, m) => a + m.value, 0);
      mi = { merge: { count: merged.reduce((a, m) => a + m.node.items, 0), bytes, nodes: merged.map(m => m.node) }, value: bytes };
      if (MERGE_SORT === "bybytes") items.push(mi);
    }
    items.sort(order);
    if (mi && MERGE_SORT === "last") items.push(mi);
    return squarify(items, rect);
  }
  const sliver = p => !p.item.merge && (p.w < MIN_PT || p.h < MIN_PT);
  if (MERGE_STRATEGY === "single") {
    const A = rect.w * rect.h, B = kids.reduce((a, k) => a + k.value, 0);
    const small = k => B > 0 && (A * k.value) / B < MIN_PT * MIN_PT;
    return pack(kids.filter(k => !small(k)), kids.filter(small));
  }
  let surv = kids.slice(), merged = [], placed = null;
  const rounds = MERGE_STRATEGY === "correct" ? 2 : 8;
  for (let r = 1; r <= rounds; r++) {
    placed = pack(surv, merged);
    const bad = new Set(placed.filter(sliver).map(p => p.item.node));
    if (!bad.size) return placed;
    if (r === rounds) return placed;
    merged = merged.concat(surv.filter(k => bad.has(k.node)));
    surv = surv.filter(k => !bad.has(k.node));
    if (!surv.length) return pack([], merged);
  }
  return placed;
}

// A package is one leaf box until it is expanded in the tree (§3.4).
function treemapChildren(n) {
  if (!n.children) return null;
  if (n.pkg && !S.expanded.has(n.id)) return null;
  return n.children;
}

let LAYOUT = { rects: [], w: 0, h: 0 };
function computeLayout(root, W, H) {
  const rects = [];
  (function walk(node, rect, depth) {
    rects.push({ node, ...rect, depth, dir: !!treemapChildren(node) });
    const kids0 = treemapChildren(node);
    if (!kids0 || rect.w <= 0 || rect.h <= 0) return;
    const kids = kids0.filter(c => shownSub(c) > 0).map(c => ({ node: c, value: shownSub(c) }));
    if (!kids.length) return;
    for (const p of layoutChildren(kids, rect)) {
      if (p.item.merge) rects.push({ merge: p.item.merge, parent: node, x: p.x, y: p.y, w: p.w, h: p.h, depth: depth + 1 });
      else walk(p.item.node, { x: p.x, y: p.y, w: p.w, h: p.h }, depth + 1);
    }
  })(root, { x: 0, y: 0, w: W, h: H }, 0);
  return { rects, w: W, h: H };
}

/* =====================================================================
   STATE
   ===================================================================== */
const S = {
  phase: "completed",          // empty|choosing|scanning|completed|cancelled|partial
  sortKey: "size", sortDir: -1,
  sel: null,                   // {node} | {merge, parent}
  expanded: new Set(),
  revealFrac: 1,
  showErrors: false, incompleteOpen: false,
  scan: { bytes: 0, files: 0, dirs: 0, elapsed: 0, cur: "" },
  treeW: 452, inspW: 300, inspOpen: true,
  errOpen: false,
  focusTree: true, theme: 0,
};
S.expanded.add(ROOT.id);
for (const c of ROOT.children) S.expanded.add(c.id);

const discovered = n => S.phase === "empty" || S.phase === "choosing" ? false
  : S.revealFrac >= 1 ? true : n.seq / ORDER <= S.revealFrac;

function shownSub(n) {
  if (S.revealFrac >= 1) return n.sub;
  if (!n.children) return discovered(n) ? n.own : 0;
  let s = 0; for (const c of n.children) s += shownSub(c); return s;
}
const hasResults = () => ["completed", "cancelled", "partial"].includes(S.phase);
const isUnreadable = n => S.showErrors && n.unreadable;
function isIncomplete(n) {
  if (!n.children && !n.pkg) return false;
  if (S.showErrors) { let bad = false; (function w(x) { if (x.unreadable) bad = true; (x.children || []).forEach(w); })(n);
    if (bad && !n.unreadable) return true; }
  if (S.incompleteOpen && n.children && !discovered(n.children[n.children.length - 1])) return true;
  return false;
}

/* =====================================================================
   ICONS
   ===================================================================== */
const svg = p => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

      : `<button class="btn ${S.phase === "empty" ? "primary" : ""}" onclick="openChooser()">${svg(I.folder)} ${S.phase === "empty" ? "Choose Folder or Drive…" : "Choose…"}</button>`}

/* =====================================================================
   TREE  — three variants
   ===================================================================== */
const COLS = [
  { k: "name",  label: "Name",  flex: true },
  { k: "size",  label: "Size",  w: 78,  num: true },
  { k: "pct",   label: "%",     w: 104, num: true },
  { k: "items", label: "Items", w: 60,  num: true },
];

function sortedChildren(n) {
  const cs = (n.children || []).slice();
  const key = S.sortKey, dir = S.sortDir;
  cs.sort((a, b) => {
    let r;
    if (key === "name") r = a.name.localeCompare(b.name, "en");
    else if (key === "items") r = a.items - b.items;
    else if (key === "kind") r = (KIND_LABEL[a.children ? "dir" : a.kind] || "").localeCompare(KIND_LABEL[b.children ? "dir" : b.kind] || "");
    else r = shownSub(a) - shownSub(b);                       // size and pct sort identically
    return (r || a.name.localeCompare(b.name, "en")) * (key === "name" ? 1 : dir);
  });
  if (key === "name" && dir < 0) cs.reverse();
  return cs;
}

function theadHTML() {

         style="${c.flex ? "flex:1 1 auto" : `flex:0 0 ${c.w}px`}" onclick="setSort('${c.k}')">
      ${c.label}<span class="car">${S.sortKey === c.k ? (S.sortDir < 0 ? "▼" : "▲") : ""}</span>
    </div>`).join("")}</div>`;
}

function tagsFor(n) {
  const t = [];
  if (n.pkg) t.push(`<span class="tag pkg">Package</span>`);
  if (n.symlink) t.push(`<span class="tag link">Symlink</span>`);

function rowsHTML(n, depth, isRoot) {

  const indent = 6 + depth * 14;
  const disc = hasKids
    ? `<span class="disc" onclick="event.stopPropagation();toggleExpand(${n.id})">${svg(I.chev)}</span>`
    : `<span class="disc"></span>`;
  const sw = `<span class="swatch" style="background:${isDir ? "var(--text-3)" : kindColor(n.kind, dark)}"></span>`;
  const nameCell = `<div class="tc name" style="padding-left:${indent}px">${disc}${sw}<span class="nm">${esc(n.name)}</span>${tagsFor(n)}</div>`;
  const kindLabel = isDir ? "Folder" : n.pkg ? "Package" : (KIND_LABEL[n.kind] || "Other");

  const cells = COLS.map(c => {
    if (c.k === "name") return nameCell;
    if (c.k === "size") return `<div class="tc num" style="flex:0 0 ${c.w}px">${sizeText(n)}</div>`;
    if (c.k === "items") return `<div class="tc num" style="flex:0 0 ${c.w}px">${isDir || n.pkg ? grp(n.items - 1) : "—"}</div>`;
    // pct — number plus an inline proportional bar in the same cell
    return `<div class="tc num" style="flex:0 0 ${c.w}px"><div class="pctcell">${pct(share)}<span class="pbar"><i style="width:${Math.min(100, share).toFixed(1)}%"></i></span></div></div>`;
  }).join("");

  let out = `<div class="trow ${open ? "open" : ""} ${sel ? "sel" : ""}" onclick="selectNode(${n.id})" ondblclick="rowActivate(${n.id})">${cells}</div>`;
  if (open && kids) for (const c of sortedChildren(n)) out += rowsHTML(c, depth + 1, false);
  return out;
}

function treeHTML() {
  return `<div class="pane" style="flex:0 0 ${S.treeW}px">
    ${theadHTML()}
    <div class="tree plain ${S.focusTree ? "focused" : ""}" id="tree" tabindex="0"
         onmousedown="setFocusTree(true)">${rowsHTML(ROOT, 0, true)}</div>
  </div>`;
}

/* =====================================================================
   TREEMAP  — canvas + manual hit testing (§4.1, §6.4)
   ===================================================================== */
let hatch = {};
function hatchPattern(ctx, dark) {
  const k = dark ? "d" : "l";
  if (!hatch[k]) {
    const c = document.createElement("canvas"); c.width = c.height = 6;
    const g = c.getContext("2d");
    g.fillStyle = dark ? "#4A4A50" : "#BCBCC3"; g.fillRect(0, 0, 6, 6);
    g.strokeStyle = dark ? "#82828C" : "#8C8C95"; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(-1, 7); g.lineTo(7, -1); g.moveTo(2, 10); g.lineTo(10, 2); g.moveTo(-4, 4); g.lineTo(4, -4); g.stroke();
    hatch[k] = c;
  }
  return ctx.createPattern(hatch[k], "repeat");
}
function redHatch(ctx, dark) {
  if (!hatch.r) {
    const c = document.createElement("canvas"); c.width = c.height = 7;
    const g = c.getContext("2d");
    g.strokeStyle = dark ? "rgba(255,105,97,.75)" : "rgba(208,52,44,.7)"; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(-1, 8); g.lineTo(8, -1); g.moveTo(3, 12); g.lineTo(12, 3); g.moveTo(-5, 4); g.lineTo(4, -5); g.stroke();
    hatch.r = c;
  }
  return ctx.createPattern(hatch.r, "repeat");
}

function drawTreemap() {
  const wrap = document.getElementById("tmwrap");
  if (!wrap) return;
  const cv = wrap.querySelector("canvas");
  const W = wrap.clientWidth, H = wrap.clientHeight;
  if (W < 8 || H < 8) return;

  LAYOUT = computeLayout(ROOT, W, H);
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  // A canvas is a replaced element: `inset:0` will NOT stretch it, so the CSS
  // size must be set explicitly or the backing store lays out at its intrinsic
  // pixel size and overflows the pane.
  cv.style.width = W + "px"; cv.style.height = H + "px";
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const dark = isDark();
  const snap = v => Math.round(v * dpr) / dpr;

  ctx.fillStyle = dark ? "#0E0E10" : "#E4E4E8";
  ctx.fillRect(0, 0, W, H);

  // 1 fills
  for (const r of LAYOUT.rects) {
    if (r.dir) continue;
    const x = snap(r.x), y = snap(r.y);
    const w = Math.max(0, snap(r.x + r.w) - x), h = Math.max(0, snap(r.y + r.h) - y);
    if (w <= 0 || h <= 0) continue;
    ctx.fillStyle = r.merge ? hatchPattern(ctx, dark) : kindColor(r.node.kind, dark);
    ctx.fillRect(x, y, w, h);
  }
  // 2 leaf hairlines
  ctx.strokeStyle = dark ? "rgba(0,0,0,.55)" : "rgba(0,0,0,.20)"; ctx.lineWidth = .5;
  for (const r of LAYOUT.rects) {
    if (r.dir || r.w < 1.2 || r.h < 1.2) continue;
    ctx.strokeRect(snap(r.x) + .25, snap(r.y) + .25, Math.max(0, r.w - .5), Math.max(0, r.h - .5));
  }
  // 3 directory outlines (post-pass, 1 pt, every level below root)
  ctx.strokeStyle = dark ? "rgba(255,255,255,.30)" : "rgba(0,0,0,.34)"; ctx.lineWidth = 1;
  for (const r of LAYOUT.rects) {
    if (!r.dir || r.depth === 0 || r.w < 2 || r.h < 2) continue;
    ctx.strokeRect(snap(r.x) + .5, snap(r.y) + .5, Math.max(0, r.w - 1), Math.max(0, r.h - 1));
  }
  // 3b incomplete → red diagonal hatch overlay (§6.3)
  for (const r of LAYOUT.rects) {
    if (r.merge || !r.node || !isIncomplete(r.node) || r.w < 3 || r.h < 3) continue;
    ctx.fillStyle = redHatch(ctx, dark);
    ctx.fillRect(snap(r.x), snap(r.y), r.w, r.h);
  }
  // 4 labels: leaf name at 11 pt only when ≥ 48×15 pt
  ctx.font = '600 11px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif';
  ctx.textBaseline = "top";
  for (const r of LAYOUT.rects) {
    if (r.dir || r.w < 48 || r.h < 15) continue;
    const label = r.merge ? `${grp(r.merge.count)} items · ${fmtIEC(r.merge.bytes)}` : r.node.name;
    const t = fitText(ctx, label, r.w - 8);
    if (!t) continue;
    ctx.lineWidth = 2.6; ctx.strokeStyle = "rgba(0,0,0,.45)";
    ctx.strokeText(t, r.x + 4, r.y + 3);
    ctx.fillStyle = "rgba(255,255,255,.96)"; ctx.fillText(t, r.x + 4, r.y + 3);
  }
  // 5 selection: 2 pt accent stroke inset 1 pt
  const selRect = currentSelRect();
  if (selRect) {
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#007AFF";
    ctx.lineWidth = 2;
    ctx.strokeRect(selRect.x + 1, selRect.y + 1, Math.max(0, selRect.w - 2), Math.max(0, selRect.h - 2));
    ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 1;
    ctx.strokeRect(selRect.x + 2.5, selRect.y + 2.5, Math.max(0, selRect.w - 5), Math.max(0, selRect.h - 5));
  }
}
function currentSelRect() {
  if (!S.sel) return null;
  if (S.sel.merge) return LAYOUT.rects.find(r => r.merge === S.sel.merge) || null;
  return LAYOUT.rects.find(r => r.node === S.sel.node) || null;
}
function fitText(ctx, s, max) {
  if (max <= 0) return "";
  if (ctx.measureText(s).width <= max) return s;
  let lo = 0, hi = s.length;
  while (lo < hi) { const m = (lo + hi + 1) >> 1;
    if (ctx.measureText(s.slice(0, m) + "…").width <= max) lo = m; else hi = m - 1; }
  return lo ? s.slice(0, lo) + "…" : "";
}
function hitTest(x, y) {
  let best = null;
  for (const r of LAYOUT.rects) {
    if (r.dir) continue;
    if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) if (!best || r.depth >= best.depth) best = r;
  }
  return best;
}

function treemapHTML() {
  const selNoRect = S.sel && S.sel.node && shownSub(S.sel.node) === 0;
  let note = "";
  if (selNoRect) note = `<div class="tm-note"><b>${esc(S.sel.node.name)}</b> has no rectangle — 0 attributed bytes. It stays listed and selectable in the tree.</div>`;
  return `<div class="pane" style="flex:1 1 auto">
    <div class="tmwrap" id="tmwrap"><canvas></canvas>${note}</div>
  </div>`;
}

/* =====================================================================
   INSPECTOR
   ===================================================================== */
function legendItems() {
  return KIND_GROUPS.map(([g]) => [g, KIND_LABEL[g]]).concat([["other", "Other"]]);
}
function inspectorHTML() {
  if (!S.inspOpen) return "";
  if (!S.sel) return `<div class="pane" style="flex:0 0 ${S.inspW}px;border-left:var(--hair) solid var(--sep-strong)">
    <div class="inspector"><div class="ins-empty">Select an item in the tree<br>or treemap to see its details.</div></div>
  </div>`;

  const body = S.sel.merge ? mergeInspectorHTML(S.sel) : nodeInspectorHTML(S.sel.node);
  return `<div class="pane" style="flex:0 0 ${S.inspW}px;border-left:var(--hair) solid var(--sep-strong)">
    <div class="inspector"><div class="ins-pad">${body}</div></div>
  </div>`;
}

function mergeInspectorHTML(sel) {
  const m = sel.merge;
  const sample = m.nodes.slice(0, 5);
  return `
    <div class="ins-title"><span class="swatch hatch"></span><h3>${grp(m.count)} merged items</h3></div>
    <div class="ins-kind">Aggregate box in ${esc(sel.parent.name)}</div>
    <div class="ins-size">${fmtIEC(m.bytes)}<small>combined</small></div>
    <div class="ins-bytes">${grp(m.bytes)} bytes</div>
    <dl class="kv">
      <dt>Items</dt><dd>${grp(m.count)}</dd>
      <dt>% of scan</dt><dd>${pct(m.bytes / TOTAL * 100)}</dd>
      <dt>% of parent</dt><dd>${pct(m.bytes / shownSub(sel.parent) * 100)}</dd>
    </dl>
    <div class="note info"><span class="gl">▦</span><div>
      <b>${grp(m.count)} items below individual size, combined ${fmtIEC(m.bytes)}.</b>
      Each would have drawn smaller than 2×2 pt, so they are shown as one exactly-sized box.
      Nothing is hidden — <b>every one is still listed and selectable in the tree.</b>
    </div></div>
    <div class="path">${sample.map(n => esc(n.name)).join("<br>")}${m.nodes.length > 5 ? `<br><span style="color:var(--text-3)">…and ${grp(m.nodes.length - 5)} more</span>` : ""}</div>
    <div class="ins-foot">An aggregate is not a file. Open and Reveal are unavailable — select an individual item in the tree instead.</div>`;
}

function nodeInspectorHTML(n) {
  const dark = isDark();
  const isDir = !!n.children && !n.pkg;
  const attributed = shownSub(n);
  const parentTotal = n.parent ? shownSub(n.parent) : TOTAL;
  const kindLabel = isDir ? "Folder" : n.pkg ? "Package" : (KIND_LABEL[n.kind] || "Other");

  let notes = "";
  if (n.symlink) notes += note("info", "↗", `<b>Symbolic link — never followed.</b> Contributes zero content bytes, so it has no rectangle.
    <span class="p">→ ${esc(n.symlink)}</span>`);
  if (n.hardlink) notes += note("info", "⧉", `<b>Hard link — counted elsewhere.</b> Logical length ${fmtIEC(n.nominal)}, attributed once to the first in-scope path.
    <span class="p">owner: ${esc(n.hardlink)}</span>`);
  if (n.cloud === "downloaded") notes += note("info", "☁", `<b>iCloud — materialized locally.</b> Counted normally. Remote-only placeholders are omitted and never downloaded.`);
  if (n.pkg) notes += note("info", "▣", `<b>Package.</b> Measured by enumerating descendants during the scan, so this total is exact.
    Expanding it in the tree subdivides its box.`);
  if (n.omitted) notes += note("warn", "☁", `<b>${grp(n.omitted)} item${n.omitted > 1 ? "s" : ""} omitted here.</b> iCloud placeholder${n.omitted > 1 ? "s" : ""} not downloaded — never fetched, counted as exclusion${n.omitted > 1 ? "s" : ""}.
    ${n.omittedName ? `<span class="p">${esc(n.omittedName)}</span>` : ""}`);
  if (isUnreadable(n)) notes += note("err", "⚠", `<b>Unreadable.</b> Permission denied — its size is <b>not guessed</b>. Every ancestor is marked Incomplete.`);
  else if (isIncomplete(n)) notes += note("warn", "⚠", `<b>Incomplete.</b> A descendant could not be fully read, so this total is a lower bound, not an exact figure.`);

  const zero = attributed === 0;
  return `
    <div class="ins-title"><span class="swatch" style="background:${isDir ? "var(--text-3)" : kindColor(n.kind, dark)}"></span><h3>${esc(n.name)}</h3></div>
    <div class="ins-kind">${kindLabel}${n.hidden ? " · Hidden" : ""}${n.volume ? " · Volume" : ""}</div>
    <div class="ins-size">${isUnreadable(n) ? "Unknown" : fmtIEC(attributed)}<small>${
      isUnreadable(n) ? "not guessed" : zero ? "no attributed bytes" : isDir || n.pkg ? "total" : "logical"}</small></div>
    <div class="ins-bytes">${isUnreadable(n) ? "size never guessed" : grp(attributed) + " bytes"}</div>
    <dl class="kv">
      ${isDir || n.pkg ? `<dt>Contains</dt><dd>${grp(n.files)} files · ${grp(n.dirs)} folders</dd>` : ""}
      <dt>Kind</dt><dd>${kindLabel}</dd>
      <dt>% of scan</dt><dd>${pct(attributed / TOTAL * 100)}</dd>
      <dt>% of parent</dt><dd>${n.parent ? pct(parentTotal ? attributed / parentTotal * 100 : 0) : "100%"}</dd>
      ${n.symlink || n.hardlink ? `<dt>Logical length</dt><dd>${fmtIEC(n.nominal)}</dd>` : ""}
      ${n.volume ? `<dt>Capacity</dt><dd>${fmtIEC(n.capacity)}</dd><dt>Free</dt><dd>${fmtIEC(n.free)}</dd>` : ""}
    </dl>
    <div class="path">${esc(n.path)}</div>
    ${notes}
    <div class="ins-actions">
      <button class="btn" onclick="doOpen()">${svg(I.open)} Open</button>
      <button class="btn primary" onclick="doReveal()">${svg(I.reveal)} Reveal</button>
    </div>
    <div class="ins-foot">Read-only. Open uses <code>NSWorkspace.open</code>, Reveal uses <code>activateFileViewerSelecting</code>. No other file action exists anywhere in this app.</div>`;
}
const note = (cls, glyph, html) => `<div class="note ${cls}"><span class="gl">${glyph}</span><div>${html}</div></div>`;

/* =====================================================================
   STATUS BAR — four legend variants
   ===================================================================== */
function statsHTML() {
  if (S.phase === "empty") return `<div class="s">No scan</div>`;
  if (S.phase === "choosing") return `<div class="s">Choose a source…</div>`;
  if (S.phase === "scanning")
    return `<div class="s"><b>Scanning…</b></div><div class="s">${fmtIEC(S.scan.bytes)}</div><div class="s">${grp(S.scan.files)} files · ${grp(S.scan.dirs)} folders</div>`;
  const frac = S.phase === "cancelled" ? S.revealFrac : 1;
  let h = `<div class="s"><b>${fmtIEC(TOTAL * frac)}</b> scanned</div>
           <div class="s">${grp(Math.round(ROOT.files * frac))} files · ${grp(Math.round(ROOT.dirs * frac))} folders</div>`;
  if (ROOT.volume) h += `<div class="s">Capacity ${fmtIEC(ROOT.capacity)} · Free ${fmtIEC(ROOT.free)}</div>`;
  if (S.phase === "partial") h += `<div class="s err">${grp(ERRORS.length)} unreadable</div><div class="s exc">${grp(EXCLUSIONS.length)} excluded</div>`;
  if (S.phase === "cancelled") h += `<div class="s" style="color:var(--warning)">Incomplete</div>`;
  return h;
}
function statusbarHTML() {
  const dark = isDark();
  const legend = `<div class="legendrow">${legendItems().map(([g, l]) =>
      `<span class="lg"><i style="background:${kindColor(g, dark)}"></i>${l}</span>`).join("")}
      <span class="lg"><i class="hatch"></i>Merged</span></div>`;
  return `<div class="sbrow">${statsHTML()}</div><div class="sbrow">${legend}</div>`;
}

/* =====================================================================
   LIFECYCLE PANELS
   ===================================================================== */
function emptyHTML() {
  return `<div class="empty"><div class="in">
    <svg style="width:82px;height:82px;opacity:.85" viewBox="0 0 16 16" fill="none" stroke="var(--text-3)" stroke-width=".7">
      <rect x="1.5" y="3" width="13" height="10" rx="1.6"/><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r=".7" fill="var(--text-3)"/></svg>
    <h1>Visualize a disk</h1>
    <p>Choose a folder or a locally attached drive to scan.<br>You'll see where every gigabyte lives — as a tree and a treemap.</p>
    <button class="btn primary" style="font-size:14px;padding:8px 17px" onclick="openChooser()">${svg(I.folder)} Choose Folder or Drive…</button>
    <div class="fine">Read-only — nothing is moved, deleted, or downloaded · hidden files included<br>
      Internal and directly-attached drives only — network volumes, disk images, and cloud roots aren't scanned</div>
  </div></div>`;
}

function scanningHTML() {
  const s = S.scan, vol = ROOT.volume;
  const used = ROOT.capacity - ROOT.free;
  const frac = vol ? Math.min(1, s.bytes / used) : 0;
  return `<div class="scancard">
    <h2>Scanning ${esc(ROOT.name)}…</h2>
    <div class="cur">${esc(s.cur || "Enumerating…")}</div>
    <div class="track ${vol ? "det" : ""}"><i style="${vol ? `width:${(frac * 100).toFixed(0)}%` : ""}"></i></div>
    <div class="approx">${vol
      ? `About ${(frac * 100).toFixed(0)}% of used space — approximate, based on what the volume reports as used`
      : `Total unknown until traversal finishes`}</div>
    <div class="telem">
      <div class="t"><div class="lab">Measured</div><div class="val">${fmtIEC(s.bytes)}</div></div>
      <div class="t"><div class="lab">Files</div><div class="val">${grp(s.files)}</div></div>
      <div class="t"><div class="lab">Folders</div><div class="val">${grp(s.dirs)}</div></div>
      <div class="t"><div class="lab">Elapsed</div><div class="val">${s.elapsed.toFixed(1)}s</div></div>
    </div>
    <div class="scan-act"><button class="btn danger" onclick="cancelScan()">${svg(I.stop)} Cancel</button></div>
  </div>`;
}

function bannerHTML() {
  if (S.phase === "cancelled") return `<div class="banner warn"><span class="dot"></span>
    <span><b>Incomplete — scan cancelled.</b> Everything already discovered is kept and fully browsable.</span>
    <span class="lnk" onclick="openChooser()">Start a fresh scan →</span></div>`;
  if (S.phase === "partial") return `<div class="banner err"><span class="dot"></span>
    <span><b>Completed with errors.</b> ${grp(ERRORS.length)} folder unreadable · ${grp(EXCLUSIONS.length)} cloud items excluded. Affected totals are lower bounds.</span>
    <span class="lnk" onclick="openErrors()">Error summary…</span></div>`;
  return "";
}

const VOLUMES = [
  { n: "Macintosh HD", d: "Internal · APFS", cap: "994 GiB · 210 GiB free", ok: true, ic: "disk" },
  { n: "Home — rengwu", d: "Folder in Macintosh HD", cap: "", ok: true, ic: "folder" },
  { n: "Samsung T7", d: "USB-C · directly attached SSD", cap: "2 TiB · 1.1 TiB free", ok: true, ic: "disk" },
  { n: "TimeMachine", d: "Network volume (SMB)", ok: false, why: "Network volumes are out of scope", ic: "disk" },
  { n: "Ubuntu-24.iso", d: "Mounted disk image", ok: false, why: "Disk images aren't scanned", ic: "disk" },
  { n: "iCloud Drive", d: "Cloud provider root", ok: false, why: "Cloud roots aren't scanned", ic: "folder" },
];
let chooserSel = 0;
function chooserHTML() {
  return `<div class="scrim" onclick="closeChooser()"><div class="sheet" onclick="event.stopPropagation()">
    <header><h2>Choose a folder or drive to scan</h2>
      <p>Only internal or directly-attached drives are eligible. Read-only — nothing is modified.</p></header>
    <div class="list">${VOLUMES.map((v, i) => `

        <div class="ic">${svg(I[v.ic])}</div>
        <div class="meta"><div class="n">${esc(v.n)}</div><div class="d">${esc(v.d)}</div></div>
        ${v.ok ? `<div class="cap">${esc(v.cap || "")}</div>` : `<div class="why">${esc(v.why)}</div>`}
      </div>`).join("")}</div>
    <footer><span class="fine">${svg(I.folder)} <code>NSOpenPanel · canChooseDirectories</code></span>

function errorsHTML() {
  return `<div class="scrim" onclick="closeErrors()"><div class="errsheet" onclick="event.stopPropagation()">

/* =====================================================================
   RENDER
   ===================================================================== */
const stage = document.getElementById("stage");
function render() {
  document.getElementById("toolbar").innerHTML = toolbarHTML();
  document.getElementById("statusbar").innerHTML = statusbarHTML();

  if (S.phase === "empty") { stage.innerHTML = emptyHTML(); afterRender(); return; }

  stage.innerHTML = `${bannerHTML()}
    <div class="split">
      ${treeHTML()}
      <div class="divider" data-target="tree"></div>
      ${treemapHTML()}
      ${S.inspOpen ? `<div class="divider" data-target="insp"></div>${inspectorHTML()}` : ""}
    </div>`;

  if (S.phase === "scanning") stage.insertAdjacentHTML("beforeend", scanningHTML());
  if (S.phase === "choosing") stage.insertAdjacentHTML("beforeend", chooserHTML());
  if (S.errOpen) stage.insertAdjacentHTML("beforeend", errorsHTML());
  afterRender();
}
function afterRender() {
  renderProtobar();
  wireDividers();
  const wrap = document.getElementById("tmwrap");
  if (wrap) {
    requestAnimationFrame(drawTreemap);
    const cv = wrap.querySelector("canvas");
    cv.addEventListener("mousemove", onTmMove);
    cv.addEventListener("mouseleave", () => tipEl.classList.remove("on"));
    cv.addEventListener("mousedown", onTmClick);
    cv.addEventListener("dblclick", onTmDbl);
  }
}

const tipEl = document.getElementById("tip");
function onTmMove(e) {
  const b = e.currentTarget.getBoundingClientRect();
  const hit = hitTest(e.clientX - b.left, e.clientY - b.top);
  if (!hit) { tipEl.classList.remove("on"); return; }
  tipEl.innerHTML = hit.merge ? mergeTipHTML(hit) : nodeTipHTML(hit.node);
  tipEl.classList.add("on");
  tipEl.style.left = Math.min(e.clientX + 14, window.innerWidth - 360) + "px";
  tipEl.style.top = Math.min(e.clientY + 16, window.innerHeight - 150) + "px";
}
const mergeTipHTML = h => `<b>${grp(h.merge.count)} items below individual size</b><br>combined ${fmtIEC(h.merge.bytes)} · ${pct(h.merge.bytes / TOTAL * 100)} of scan
  <br><span class="flag">Selectable · all still listed in the tree</span><br><span class="p">in ${esc(h.parent.path)}</span>`;
function nodeTipHTML(n) {
  const flags = [];
  if (n.pkg) flags.push("Package");
  if (n.cloud === "downloaded") flags.push("iCloud, materialized");
  if (n.hidden) flags.push("Hidden");
  if (isUnreadable(n)) flags.push("Unreadable — size not guessed");
  else if (isIncomplete(n)) flags.push("Incomplete — lower bound");
  return `<b>${esc(n.name)}</b><br>${fmtIEC(shownSub(n))} · ${grp(shownSub(n))} bytes
    <br>${KIND_LABEL[n.children && !n.pkg ? "dir" : n.kind]} · ${pct(shownSub(n) / TOTAL * 100)} of scan
    ${flags.length ? `<br><span class="flag">${flags.join(" · ")}</span>` : ""}
    <br><span class="p">${esc(n.path)}</span>`;
}
function onTmClick(e) {
  setFocusTree(false);
  const b = e.currentTarget.getBoundingClientRect();
  const hit = hitTest(e.clientX - b.left, e.clientY - b.top);
  if (!hit) return;
  if (hit.merge) { S.sel = { merge: hit.merge, parent: hit.parent }; render(); return; }
  selectNode(hit.node.id, true);
}
function onTmDbl(e) {
  const b = e.currentTarget.getBoundingClientRect();
  const hit = hitTest(e.clientX - b.left, e.clientY - b.top);
  if (!hit || hit.merge) return;
  doOpen();
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function selectNode(id, scroll) {
  const n = BYID[id];
  S.sel = { node: n };
  let p = n.parent; while (p) { S.expanded.add(p.id); p = p.parent; }
  render();
  if (scroll) {
    const rows = document.querySelectorAll(".trow");
    const idx = visibleRows().findIndex(r => r === n);
    if (idx >= 0 && rows[idx]) rows[idx].scrollIntoView({ block: "nearest" });
  }
}
function toggleExpand(id) {
  const n = BYID[id];
  if (S.expanded.has(id)) S.expanded.delete(id); else S.expanded.add(id);
  render();
}
function rowActivate(id) { const n = BYID[id]; if (n.children || n.pkg) toggleExpand(id); else doOpen(); }
function setFocusTree(v) { S.focusTree = v; const t = document.getElementById("tree"); if (t) t.classList.toggle("focused", v); }
function setSort(k) {
  if (k === "pct") k = "size";
  if (S.sortKey === k) S.sortDir *= -1; else { S.sortKey = k; S.sortDir = k === "name" || k === "kind" ? 1 : -1; }
  render();
}
function toggleInspector() { S.inspOpen = !S.inspOpen; render(); }


function openChooser() { stopScan(); S.phase = "choosing"; render(); }
function closeChooser() { S.phase = S.lastResult || "empty"; render(); }
function openErrors() { S.errOpen = true; render(); }
function closeErrors() { S.errOpen = false; render(); }

let timer = null;
function beginScan() {
  S.phase = "scanning"; S.sel = null; S.revealFrac = 0; S.showErrors = false; S.incompleteOpen = false;
  S.scan = { bytes: 0, files: 0, dirs: 0, elapsed: 0, cur: "" };
  const DUR = 3.4, t0 = performance.now();
  render();
  clearInterval(timer);
  timer = setInterval(() => {
    const el = (performance.now() - t0) / 1000;
    S.scan.elapsed = el;
    let f = Math.min(1, el / DUR); f = 1 - Math.pow(1 - f, 2.2);
    S.revealFrac = f;
    let bytes = 0, files = 0, dirs = 0, cur = "";
    (function w(n) {
      if (!discovered(n)) return;
      if (n.children && !n.pkg) { dirs++; n.children.forEach(w); } else { files++; bytes += n.own; cur = n.path; }
    })(ROOT);
    S.scan = { bytes, files, dirs, elapsed: el, cur };
    const card = document.querySelector(".scancard");
    if (card) card.outerHTML = scanningHTML();
    document.getElementById("statusbar").innerHTML = statusbarHTML();
    const t = document.getElementById("tree");
    if (t) { const sc = t.scrollTop; t.innerHTML = rowsHTML(ROOT, 0, true); t.scrollTop = sc; }
    drawTreemap();
    if (f >= 1) finish("completed");
  }, 90);
}
function stopScan() { clearInterval(timer); }
function finish(phase) {
  stopScan(); S.revealFrac = 1; S.phase = phase; S.lastResult = phase;
  if (phase === "partial") S.showErrors = true;
  render();
}
function cancelScan() {
  if (S.phase !== "scanning") return;
  stopScan();
  S.phase = "cancelled"; S.lastResult = "cancelled"; S.incompleteOpen = true;
  if (S.revealFrac >= 1) S.revealFrac = .62;
  render();
  toast("Scan cancelled — everything already discovered is retained.");
}
function doOpen() {
  const n = S.sel && S.sel.node; if (!n) return;
  toast(`Open “${esc(n.name)}” · <code>NSWorkspace.shared.open(url)</code> — prototype makes no real call.`);
}
function doReveal() {
  const n = S.sel && S.sel.node; if (!n) return;
  toast(`Reveal “${esc(n.name)}” · <code>activateFileViewerSelecting([url])</code> — prototype makes no real call.`);
}
let toastT;
function toast(m) {
  const el = document.getElementById("toast");
  el.innerHTML = m; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 4000);
}

function visibleRows() {
  const out = [];
  (function w(n, root) {
    if (!root && !discovered(n)) return;
    out.push(n);
    if (S.expanded.has(n.id) && n.children) for (const c of sortedChildren(n)) w(c, false);
  })(ROOT, true);
  return out;
}

/* ---------- dividers ---------- */
function wireDividers() {
  document.querySelectorAll(".divider").forEach(d => d.addEventListener("mousedown", startDrag));
}
function startDrag(e) {
  e.preventDefault();
  const which = e.currentTarget.dataset.target;
  const x0 = e.clientX, w0 = which === "tree" ? S.treeW : S.inspW;
  const move = ev => {
    const d = ev.clientX - x0;
    if (which === "tree") S.treeW = Math.max(380, Math.min(680, w0 + d));
    else S.inspW = Math.max(220, Math.min(520, w0 - d));
    const pane = which === "tree"
      ? document.querySelector(".split > .pane")
      : document.querySelector(".split > .pane:last-child");
    if (pane) pane.style.flex = `0 0 ${which === "tree" ? S.treeW : S.inspW}px`;
    drawTreemap();
  };
  const up = () => { document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up); };
  document.addEventListener("mousemove", move); document.addEventListener("mouseup", up);
}

/* =====================================================================
   PROTO BAR
   ===================================================================== */
const STATES = [["empty", "Empty"], ["choosing", "Choosing"], ["scanning", "Scanning"],
                ["completed", "Completed"], ["cancelled", "Cancelled"], ["partial", "With errors"]];
function renderProtobar() {
  const seg = (opts, cur, fn) => `<div class="seg">${opts.map(([k, l]) =>
    `<button class="${cur === k ? "on" : ""}" onclick="${fn}('${k}')">${l}</button>`).join("")}</div>`;
  document.getElementById("protobar").innerHTML = `
    <span class="plabel">Proto</span>
    <div class="grp"><span class="gl">State</span>${seg(STATES, S.phase, "gotoState")}</div>
    <div class="vbar"></div>
    <button class="arw" onclick="cycleTheme()" title="Toggle appearance">◐</button>`;
}
function gotoState(k) {
  stopScan(); S.errOpen = false;
  if (k === "empty") { S.phase = "empty"; S.sel = null; S.lastResult = null; S.revealFrac = 1; }
  else if (k === "choosing") { S.phase = "choosing"; }
  else if (k === "scanning") { beginScan(); syncURL(); return; }
  else if (k === "completed") { Object.assign(S, { phase: "completed", lastResult: "completed", revealFrac: 1, showErrors: false, incompleteOpen: false }); }
  else if (k === "cancelled") { Object.assign(S, { phase: "cancelled", lastResult: "cancelled", revealFrac: .62, showErrors: false, incompleteOpen: true }); }
  else if (k === "partial") { Object.assign(S, { phase: "partial", lastResult: "partial", revealFrac: 1, showErrors: true, incompleteOpen: false }); }
  syncURL(); render();
}
function cycleTheme() {
  S.theme = (S.theme + 1) % 3;
  const r = document.documentElement;
  if (S.theme === 0) r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.theme === 1 ? "light" : "dark");
  hatch = {}; render();
}

/* ---------- URL: shareable / reload-stable ---------- */
function syncURL() {
  const u = new URL(location.href);
  u.searchParams.set("state", S.phase);
  history.replaceState(null, "", u);
}
function readURL() {
  const u = new URL(location.href), g = k => u.searchParams.get(k);
  const st = g("state");
  if (st && st !== "scanning" && STATES.some(s => s[0] === st)) gotoStateSilently(st);
}
function gotoStateSilently(k) {
  if (k === "empty") { S.phase = "empty"; }
  else if (k === "choosing") { S.phase = "choosing"; }
  else if (k === "cancelled") Object.assign(S, { phase: "cancelled", lastResult: "cancelled", revealFrac: .62, incompleteOpen: true });
  else if (k === "partial") Object.assign(S, { phase: "partial", lastResult: "partial", showErrors: true });
  else Object.assign(S, { phase: "completed", lastResult: "completed" });
}

/* ---------- keyboard (§7.2) ---------- */
document.addEventListener("keydown", e => {
  const t = (e.target.tagName || "").toLowerCase();
  if (t === "input" || t === "textarea" || e.target.isContentEditable) return;
  if (e.key === "Escape") { if (S.errOpen) { closeErrors(); return; } if (S.phase === "choosing") { closeChooser(); return; } return; }
  if (!hasResults()) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const rows = visibleRows();
    let i = S.sel && S.sel.node ? rows.indexOf(S.sel.node) : -1;
    if (i < 0) i = e.key === "ArrowDown" ? -1 : 0;
    i = Math.max(0, Math.min(rows.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)));
    setFocusTree(true); selectNode(rows[i].id, true); e.preventDefault(); return;
  }
  if (e.key === "ArrowRight" && S.sel && S.sel.node && (S.sel.node.children || S.sel.node.pkg) && !S.expanded.has(S.sel.node.id)) { toggleExpand(S.sel.node.id); e.preventDefault(); return; }
  if (e.key === "ArrowLeft" && S.sel && S.sel.node && S.expanded.has(S.sel.node.id)) { toggleExpand(S.sel.node.id); e.preventDefault(); return; }
  if (e.metaKey && (e.key === "o" || e.key === "O")) { doOpen(); e.preventDefault(); }
  if (e.metaKey && (e.key === "r" || e.key === "R")) { doReveal(); e.preventDefault(); }
  if (e.key === "Enter" && S.sel && S.sel.node) { rowActivate(S.sel.node.id); e.preventDefault(); }
});

let rz;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(drawTreemap, 70); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { hatch = {}; render(); });

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

readURL();
render();
</script>
