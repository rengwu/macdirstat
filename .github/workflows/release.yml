name: Release
run-name: Release ${{ inputs.version || github.ref_name }}

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (for example 1.0.0)'
        required: true
        type: string
      create_draft:
        description: 'Create a draft prerelease (off = validate and upload workflow artifacts only)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      number: ${{ steps.version.outputs.number }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version=${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Use a version such as 1.0.0, or a tag such as v1.0.0.' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'The version must match the selected tag.' >&2
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    needs: [version, test]
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      VERSION: ${{ needs.version.outputs.number }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify universal ZIPs
        run: make package
      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  draft:
    if: github.event_name == 'push' || inputs.create_draft
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.number }}
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
          # Never attach this commit's binaries to a tag for another commit.
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" \
            --jq '.[] | select(.ref == ("refs/tags/" + env.TAG)) | .ref')
          if [[ -n "$existing" ]]; then
            tagged_commit=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG points at a different commit. Run the workflow on that tag or use a new version." >&2
              exit 1
            fi
          fi
          gh release create "$TAG" \
            "MacDirStat-$VERSION-macos-universal.zip" \
            "MacDirStat-$VERSION-debug-symbols.zip" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "MacDirStat $VERSION" \
            --draft --prerelease --generate-notes --notes-file RELEASE_NOTES.md
